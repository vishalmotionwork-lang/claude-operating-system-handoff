<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- KnowAI Document · locked format · post-meeting visual report -->
<title>{{TITLE}} — KnowAI</title>
<style>
  @font-face { font-family: 'Aeonik'; font-weight: 400; font-style: normal; src: url('fonts/AeonikTRIAL-Regular.otf') format('opentype'); font-display: swap; }
  @font-face { font-family: 'Aeonik'; font-weight: 700; font-style: normal; src: url('fonts/AeonikTRIAL-Bold.otf') format('opentype'); font-display: swap; }
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --blue:#146DF7; --blue-ink:#0F55C6; --blue-deep:#0A3C91; --blue-soft:#CFF0FF; --lime:#C8FF3D;
    --ink:#05121B; --ink-2:#10222F; --ink-3:#4C5963; --ink-4:#5B6B76; --ink-5:#A6B5BF;
    --paper:#F7F7F7; --surface:#FFFFFF; --surface-2:#FAFAFA;
    --gray-100:#F5F5F5; --gray-200:#E7E7E8; --gray-300:#D1D5D8;
    --hairline:rgba(5,18,27,0.08); --divider:rgba(5,18,27,0.06);
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
    --shadow-xs:0 1px 2px rgba(5,18,27,.05);
    --font-sans:'Aeonik','Inter Tight',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:3px}
  ::selection{background:var(--blue-soft);color:var(--blue-deep)}
  .shell{max-width:1440px;margin:0 auto;padding:56px 48px 120px}
  @media(max-width:900px){.shell{padding:32px 20px 80px}}

  /* ===== Header ===== */
  .eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  h1.page-title{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1.05;color:var(--ink);margin:8px 0 6px}
  .page-sub{color:var(--ink-3);font-size:16px;max-width:780px}
  .header{padding-bottom:28px;border-bottom:1px solid var(--hairline);margin-bottom:32px}
  .props{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 32px;margin-top:24px}
  @media(max-width:800px){.props{grid-template-columns:repeat(2,1fr)}}
  .prop-k{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
  .prop-v{font-size:14px;color:var(--ink)}

  /* ===== Callouts ===== */
  .welcome{background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--blue);border-radius:var(--r-md);padding:18px 22px;margin-bottom:16px;font-size:15px;color:var(--ink-2);box-shadow:var(--shadow-xs)}
  .welcome strong{color:var(--ink);font-weight:700}
  .welcome em{font-style:normal;font-family:var(--font-mono);font-size:12px;padding:1px 6px;background:var(--gray-100);border-radius:var(--r-sm);color:var(--ink)}
  .alert{background:#FFFBF3;border:1px solid #FFD9A8;border-left:3px solid #F59E0B;border-radius:var(--r-md);padding:18px 22px;margin-bottom:32px;font-size:15px;color:var(--ink-2)}
  .alert strong{color:var(--ink);font-weight:700}
  .alert-k{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#8A4B00;margin-bottom:8px}

  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:32px;padding:14px 18px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--shadow-xs)}
  .legend-label{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}

  /* ===== TOC ===== */
  .toc{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:28px 32px;margin-bottom:56px;box-shadow:var(--shadow-xs)}
  .toc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--divider)}
  .toc-head h3{font-size:22px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
  .toc-head-meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
  .toc-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 32px}
  @media(max-width:1100px){.toc-sections{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.toc-sections{grid-template-columns:1fr}}
  .toc-sec-label{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--blue-soft)}
  .toc a{color:var(--ink);font-size:14px;display:flex;align-items:baseline;gap:10px;padding:4px 0}
  .toc a:hover{color:var(--blue);text-decoration:none}
  .toc-num{font-family:var(--font-mono);font-weight:500;font-size:12px;color:var(--ink-4);min-width:22px;font-variant-numeric:tabular-nums}

  /* ===== Section banner ===== */
  .section-banner{margin:64px 0 24px;padding:24px 0 18px;border-top:1px solid var(--hairline)}
  .section-banner h2{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.15;color:var(--ink);margin:6px 0 4px}
  .section-banner p{color:var(--ink-3);font-size:15px;max-width:800px}

  /* ===== Topic card ===== */
  .topic{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:24px 28px;margin-bottom:16px;scroll-margin-top:24px;box-shadow:var(--shadow-xs)}
  .topic-head{display:flex;align-items:flex-start;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--divider);margin-bottom:18px}
  .topic-num{width:36px;height:36px;background:var(--ink);color:var(--surface);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:13px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .topic-title-block{flex:1;min-width:0}
  .topic-name{font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.25;color:var(--ink)}
  .topic-meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}

  /* ===== Status pills ===== */
  .status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;background:var(--gray-100);color:var(--ink-3);border:1px solid var(--hairline)}
  .status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink-5)}
  .status.live{background:#E6F7F0;color:#1F6B4D;border-color:#BFE6D6}
  .status.live::before{background:#00B67A}
  .status.building{background:#FFF4E5;color:#8A4B00;border-color:#FFD9A8}
  .status.building::before{background:#F59E0B}
  .status.planned{background:#EEF2FF;color:#3949A2;border-color:#C7D2FE}
  .status.planned::before{background:#6366F1}
  .status.blocked{background:#FEF2F2;color:#A83A3A;border-color:#F0D5D5}
  .status.blocked::before{background:#DC5555}
  .status.infer{background:#F6F1FF;color:#5B3FA8;border-color:#DCCEFB}
  .status.infer::before{background:#8B5CF6}

  /* ===== Field grid ===== */
  .fields{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 32px}
  @media(max-width:760px){.fields{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--divider)}
  .field:nth-last-child(-n+2){border-bottom:none}
  @media(max-width:760px){.field{border-bottom:1px solid var(--divider)}.field:last-child{border-bottom:none}.field:nth-last-child(2){border-bottom:1px solid var(--divider)}}
  .field.wide{grid-column:1/-1}
  .field-label{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .field-value{font-size:14.5px;line-height:1.55;color:var(--ink-2)}
  .field-value ul,.field-value ol{padding-left:18px;margin-top:4px}
  .field-value li{margin-bottom:5px}
  .field-value strong{color:var(--ink);font-weight:700}
  .field-value code{font-family:var(--font-mono);font-size:12.5px;background:var(--gray-100);padding:1px 6px;border-radius:var(--r-sm);color:var(--ink)}

  /* ===== Receipts / inference markers ===== */
  .src{display:inline-block;font-family:var(--font-mono);font-size:10.5px;font-weight:500;background:var(--gray-100);color:var(--ink-4);border:1px solid var(--hairline);padding:1px 7px;border-radius:var(--r-sm);vertical-align:1px}
  .inf{display:inline-block;font-family:var(--font-mono);font-size:10.5px;font-weight:500;background:#F6F1FF;color:#5B3FA8;border:1px solid #DCCEFB;padding:1px 7px;border-radius:var(--r-sm);vertical-align:1px}

  /* ===== Figure wrapper ===== */
  .viz{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:26px 28px 24px;margin-bottom:16px;box-shadow:var(--shadow-xs);overflow-x:auto}
  .viz-cap{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:20px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .viz-cap b{color:var(--blue);font-weight:500}
  .viz-note{margin-top:20px;padding-top:14px;border-top:1px solid var(--divider);font-size:13.5px;color:var(--ink-3)}
  .viz-note strong{color:var(--ink-2);font-weight:700}

  /* ===== Node primitive (used by flow + tree) ===== */
  .node{display:block;background:var(--surface-2);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:12px 14px}
  .node-t{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.01em;line-height:1.3}
  .node-s{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}
  .node-k{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:6px;display:block}
  .node.dark{background:var(--ink);border-color:var(--ink)}
  .node.dark .node-t{color:#fff}
  .node.dark .node-s{color:rgba(255,255,255,.66)}
  .node.dark .node-k{color:var(--lime)}
  .node.accent{background:#F2F7FF;border-color:#C9DEFF}
  .node.accent .node-k{color:var(--blue)}
  .node.ghost{background:transparent;border-style:dashed;border-color:var(--gray-300)}
  .node.ghost .node-t{color:var(--ink-3)}
  .node.warn{background:#FEF7F7;border-color:#F0D5D5}
  .node.warn .node-k{color:#A83A3A}

  /* ===== FLOW — pipelines, chains, gates ===== */
  .flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;min-width:700px}
  .flow .node{flex:1}
  .flow-arrow{flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:var(--ink-5);font-size:15px}
  @media(max-width:820px){.flow{flex-direction:column;min-width:0}.flow-arrow{flex:0 0 22px;transform:rotate(90deg)}}
  .flow-back{margin-top:12px;padding-top:12px;border-top:1px dashed var(--gray-300);font-family:var(--font-mono);font-size:11.5px;color:var(--ink-4)}
  .flow-back b{color:#8A4B00;font-weight:500}

  /* ===== TREE — hierarchy / org / taxonomy ===== */
  .tree-root{max-width:300px;margin:0 auto}
  .tree-stem{width:1px;height:26px;background:var(--gray-300);margin:0 auto}
  .tree-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative;padding-top:26px;min-width:700px}
  .tree-row.c5{grid-template-columns:repeat(5,1fr)}
  .tree-row::before{content:'';position:absolute;top:0;left:12.5%;right:12.5%;height:1px;background:var(--gray-300)}
  .tree-row.c5::before{left:10%;right:10%}
  .tree-col{position:relative}
  .tree-col::before{content:'';position:absolute;top:-26px;left:50%;width:1px;height:26px;background:var(--gray-300)}
  @media(max-width:820px){.tree-row,.tree-row.c5{grid-template-columns:1fr;min-width:0;padding-top:14px;gap:10px}.tree-row::before,.tree-col::before{display:none}.tree-stem{height:14px}}

  /* ===== STATS — headline numbers ===== */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  @media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface-2);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:16px 16px 14px}
  .stat.zero{border-style:dashed;border-color:var(--gray-300);background:transparent}
  .stat.warn{background:#FFFBF3;border-color:#FFD9A8}
  .stat-n{font-family:var(--font-mono);font-weight:600;font-size:28px;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .stat.zero .stat-n{color:var(--ink-5)}
  .stat-n small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
  .stat-l{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);margin-top:8px}
  .stat-d{font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.4}

  /* ===== BARS — weighted comparison ===== */
  .bars{display:flex;flex-direction:column;gap:10px}
  .bar-row{display:grid;grid-template-columns:170px 1fr 96px;gap:14px;align-items:center}
  @media(max-width:700px){.bar-row{grid-template-columns:110px 1fr 70px;gap:10px}}
  .bar-k{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .bar-track{height:26px;background:var(--gray-100);border-radius:var(--r-sm);overflow:hidden;display:flex}
  .bar-fill{height:100%;background:var(--blue)}
  .bar-fill.b2{background:#4A8FF9}.bar-fill.b3{background:#7BADFB}.bar-fill.b4{background:#A9C9FC}.bar-fill.b5{background:#CFE0FD}
  .bar-v{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
  .bar-v b{color:var(--ink);font-weight:600;font-size:14px}

  /* ===== FUNNEL — narrowing stages ===== */
  .funnel{display:flex;flex-direction:column;gap:10px;align-items:center}
  .rung{border-radius:var(--r-md);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border:1px solid var(--gray-200);background:var(--surface-2)}
  .rung.r1{width:100%;background:#EAF2FE;border-color:#C9DEFF}
  .rung.r2{width:78%;background:#F3F8FF;border-color:#DCE9FF}
  .rung.r3{width:56%}
  @media(max-width:820px){.rung.r2,.rung.r3{width:100%}}
  .rung-k{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
  .rung-k span{display:block;font-weight:400;letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--ink-3);margin-top:3px;font-family:var(--font-sans)}
  .rung-v{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rung-v b{color:var(--ink);font-weight:600}

  /* ===== HUB — one core, many satellites ===== */
  .hub{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px}
  .hub-core{grid-column:2/4;background:var(--ink);border:1px solid var(--ink);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .hub-core .node-t{color:#fff;font-size:17px}
  .hub-core .node-s{color:rgba(255,255,255,.66)}
  .hub-core .node-k{color:var(--lime)}
  .chip-c{background:var(--surface-2);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
  .chip-t{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .chip-s{font-size:12px;color:var(--ink-3);margin-top:3px}
  .chip-c.asset{background:#FAFCFF;border-color:#DCE9FF}
  .chip-c.asset .chip-t{color:var(--blue-ink)}
  @media(max-width:820px){.hub{grid-template-columns:repeat(2,1fr);min-width:0}.hub-core{grid-column:1/-1}}

  /* ===== SPLIT — this vs that ===== */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.split{grid-template-columns:1fr}}
  .side{border-radius:var(--r-md);padding:18px 20px;border:1px solid var(--gray-200);background:var(--surface-2)}
  .side.no{border-color:#F0D5D5;background:#FEF7F7}
  .side.yes{border-color:#C9DEFF;background:#F2F7FF}
  .side-k{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .side.no .side-k{color:#A83A3A}
  .side.yes .side-k{color:var(--blue)}
  .side ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .side li{font-size:14px;color:var(--ink-2);padding-left:20px;position:relative;line-height:1.5}
  .side.no li::before{content:'\00d7';position:absolute;left:0;color:#C05555;font-weight:700}
  .side.yes li::before{content:'\2713';position:absolute;left:0;color:var(--blue);font-weight:700}

  /* ===== SWAP — before vs after ===== */
  .swap{display:grid;grid-template-columns:1fr 64px 1fr;align-items:stretch;min-width:700px}
  @media(max-width:820px){.swap{grid-template-columns:1fr;min-width:0;gap:12px}}
  .swap-col{border:1px solid var(--gray-200);border-radius:var(--r-md);background:var(--surface-2);padding:18px 20px}
  .swap-col.then{opacity:.72}
  .swap-col.now{background:#F2F7FF;border-color:#C9DEFF}
  .swap-k{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--gray-200)}
  .swap-col.now .swap-k{color:var(--blue);border-bottom-color:#C9DEFF}
  .swap-row{padding:10px 0;border-bottom:1px solid var(--divider)}
  .swap-row:last-child{border-bottom:none}
  .swap-who{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .swap-what{font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.45}
  .swap-mid{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--blue)}
  @media(max-width:820px){.swap-mid{padding:4px 0;transform:rotate(90deg)}}

  /* ===== PRINCIPLE — the dark block ===== */
  .principle{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:28px 30px;margin-bottom:16px}
  .principle-k{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}
  .principle-h{font-size:25px;font-weight:700;letter-spacing:-.025em;line-height:1.22;color:#fff;max-width:880px}
  .principle-p{margin-top:14px;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.72);max-width:880px}
  .principle-p strong{color:#fff;font-weight:700}
  .formula{margin-top:20px;font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--lime);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-md);padding:14px 18px;display:inline-block;letter-spacing:-.01em}
  @media(max-width:640px){.principle-h{font-size:20px}.formula{font-size:12px;padding:12px 14px}}

  /* ===== TABLE ===== */
  .tbl{width:100%;border-collapse:collapse;min-width:700px}
  .tbl th{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);text-align:left;padding:0 14px 10px 0;border-bottom:1px solid var(--gray-200)}
  .tbl td{font-size:14px;color:var(--ink-2);vertical-align:top;padding:13px 14px 13px 0;border-bottom:1px solid var(--divider)}
  .tbl tr:last-child td{border-bottom:none}
  .tbl td strong{color:var(--ink);font-weight:700}
  .tbl td:first-child{font-weight:700;color:var(--ink)}
  .tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-pill);background:var(--gray-100);color:var(--ink-3);border:1px solid var(--hairline);white-space:nowrap}
  .tag.ok{background:#E6F7F0;color:#1F6B4D;border-color:#BFE6D6}
  .tag.wip{background:#FFF4E5;color:#8A4B00;border-color:#FFD9A8}
  .tag.block,.tag.dead{background:#FEF2F2;color:#A83A3A;border-color:#F0D5D5}
  .tag.drift{background:#FFF4E5;color:#8A4B00;border-color:#FFD9A8}
  .tag.new{background:#EEF2FF;color:#3949A2;border-color:#C7D2FE}
  .tag.none{background:transparent;color:var(--ink-4);border-style:dashed;border-color:var(--gray-300)}
  .tag.infer{background:#F6F1FF;color:#5B3FA8;border-color:#DCCEFB}

  /* ===== BUILD — stepped argument ===== */
  .build{display:flex;flex-direction:column}
  .build-step{display:grid;grid-template-columns:118px 1fr;gap:20px;padding:15px 0;border-bottom:1px solid var(--divider)}
  .build-step:last-child{border-bottom:none}
  @media(max-width:700px){.build-step{grid-template-columns:1fr;gap:6px}}
  .build-k{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);padding-top:3px}
  .build-step.hi .build-k{color:var(--blue)}
  .build-v{font-size:14.5px;color:var(--ink-2);line-height:1.55}
  .build-v strong{color:var(--ink);font-weight:700}
  .build-v .quote{display:block;margin-top:6px;font-size:14px;color:var(--ink-3);font-style:italic}
  .build-v .receipt{display:inline-block;margin-top:8px;margin-right:8px;font-family:var(--font-mono);font-size:12px;background:#F2F7FF;border:1px solid #C9DEFF;color:var(--blue-ink);padding:4px 10px;border-radius:var(--r-sm)}

  /* ===== STACK — ranked priorities ===== */
  .stack{display:flex;flex-direction:column;gap:12px}
  .prio{display:grid;grid-template-columns:52px 1fr 160px;gap:18px;align-items:center;background:var(--surface-2);border:1px solid var(--gray-200);border-left:3px solid var(--gray-300);border-radius:var(--r-md);padding:16px 18px}
  .prio.p1{border-left-color:var(--blue);background:#F2F7FF;border-color:#C9DEFF}
  .prio.p2{border-left-color:#7BADFB}
  .prio.off{border-style:dashed;background:transparent;opacity:.8}
  @media(max-width:760px){.prio{grid-template-columns:42px 1fr}.prio-w{grid-column:2}}
  .prio-n{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--ink-5);font-variant-numeric:tabular-nums}
  .prio.p1 .prio-n{color:var(--blue)}
  .prio-t{font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:-.015em}
  .prio.off .prio-t{color:var(--ink-3)}
  .prio-d{font-size:13px;color:var(--ink-3);margin-top:4px;line-height:1.45}
  .prio-w{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);text-align:right}
  @media(max-width:760px){.prio-w{text-align:left;margin-top:8px}}

  /* ===== TIMELINE ===== */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--gray-300)}
  .tl{position:relative;padding-bottom:22px}
  .tl:last-child{padding-bottom:0}
  .tl::before{content:'';position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--gray-300)}
  .tl.done::before{background:var(--ink);border-color:var(--ink)}
  .tl.now::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px rgba(20,109,247,.14)}
  .tl-w{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
  .tl.now .tl-w{color:var(--blue)}
  .tl-t{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:3px}
  .tl-d{font-size:13.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}

  /* ===== CARDS ===== */
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.cards4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:860px){.cards3{grid-template-columns:1fr}}
  @media(max-width:620px){.cards4{grid-template-columns:1fr}}
  .fcard{background:var(--surface-2);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:18px 20px;display:flex;flex-direction:column}
  .fcard-pin{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
  .fcard-t{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
  .fcard-b{font-size:13.5px;color:var(--ink-3);margin-top:8px;line-height:1.55;flex:1}
  .fcard-f{margin-top:14px;padding-top:12px;border-top:1px solid var(--divider);font-family:var(--font-mono);font-size:11px;color:var(--ink-4)}

  /* ===== CHECKS — requirement grid ===== */
  .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:900px){.checks{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.checks{grid-template-columns:1fr}}
  .check{background:#F2F7FF;border:1px solid #C9DEFF;border-radius:var(--r-md);padding:14px 16px}
  .check-n{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;color:var(--blue);margin-bottom:6px}
  .check-t{font-size:14px;font-weight:700;color:var(--ink);line-height:1.35}
  .check-d{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}

  /* ===== ROSTER — attendance ===== */
  .roster{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:760px){.roster{grid-template-columns:1fr}}
  .rcol{border:1px solid var(--gray-200);background:var(--surface-2);border-radius:var(--r-md);padding:18px 20px}
  .rcol.miss{border-color:#F0D5D5;background:#FEF7F7}
  .rcol-k{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:12px}
  .rcol.miss .rcol-k{color:#A83A3A}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:13px;padding:4px 11px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--gray-200);color:var(--ink-2)}
  .rcol.miss .chip{border-color:#F0D5D5}

  /* ===== RATIO — proportional split bar ===== */
  .ratio{display:flex;height:58px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--gray-200)}
  .ratio-seg{display:flex;flex-direction:column;justify-content:center;padding:0 18px}
  .ratio-seg.a{background:#E9F1FE;flex:0 0 62%}
  .ratio-seg.b{background:var(--surface-2);flex:1}
  .ratio-n{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--ink)}
  .ratio-l{font-size:12.5px;color:var(--ink-3);margin-top:2px}

  /* ===== CREATORS — reference cards with local assets ===== */
  .creators{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:950px){.creators{grid-template-columns:1fr}}
  .cr{background:var(--surface-2);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:16px 18px}
  .cr-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .cr-av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--gray-200);flex-shrink:0;background:var(--gray-100)}
  .cr-n{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.015em;line-height:1.2}
  .cr-h{font-family:var(--font-mono);font-size:11px;color:var(--ink-4);margin-top:2px}
  .cr-thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  .cr-thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--gray-200);display:block;background:var(--gray-100)}
  .cr-take{font-size:13px;color:var(--ink-2);line-height:1.5}
  .cr-take b{color:var(--ink)}
  .cr-f{margin-top:10px;padding-top:10px;border-top:1px solid var(--divider);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4)}

  /* ===== INFERENCE block — clearly separated from record ===== */
  .infer-block{background:#FCFAFF;border:1px solid #DCCEFB;border-left:3px solid #8B5CF6;border-radius:var(--r-lg);padding:24px 28px;margin-bottom:16px}
  .infer-k{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#5B3FA8;margin-bottom:14px}
  .infer-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 0;border-bottom:1px solid rgba(139,92,246,.14)}
  .infer-row:last-child{border-bottom:none}
  @media(max-width:760px){.infer-row{grid-template-columns:1fr;gap:8px}}
  .infer-c{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#5B3FA8;margin-bottom:5px}
  .infer-t{font-size:14.5px;color:var(--ink-2);line-height:1.55}
  .infer-t strong{color:var(--ink);font-weight:700}

  .footer{margin-top:96px;padding-top:24px;border-top:1px solid var(--hairline);font-family:var(--font-mono);font-size:12px;color:var(--ink-4);text-align:center}

  @media print{.topic,.viz,.principle,.infer-block{break-inside:avoid;box-shadow:none}.toc{box-shadow:none}.viz,.flow,.tree-row,.hub,.tbl,.swap{overflow:visible;min-width:0}}
</style>
</head>
